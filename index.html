<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>南アルプス市消防本部 災害対策情報システム</title>
    <style>
      html, body, #root {
        min-height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (!window.storage) {
        window.storage = {
          async get(key) {
            const value = localStorage.getItem(key);
            return value == null ? null : { value };
          },
          async set(key, value) {
            localStorage.setItem(key, value);
          },
          async delete(key) {
            localStorage.removeItem(key);
          },
        };
      }
    </script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
